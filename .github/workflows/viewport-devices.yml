name: Vista dispositivos
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/legacy/**'
      - 'tests/viewport-devices.mjs'
      - '.github/workflows/viewport-devices.yml'
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/viewport-devices.mjs
