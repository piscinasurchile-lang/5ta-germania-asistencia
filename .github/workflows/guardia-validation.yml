name: Guardia validation
on:
  pull_request:
    paths:
      - 'app/api/state/**'
      - 'public/legacy/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/guardia-validation.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
