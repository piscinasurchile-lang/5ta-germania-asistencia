name: Telegram sandbox tests
on:
  push:
    branches:
      - test/telegram-emergencias-villarrica-2022
    paths:
      - 'experiments/telegram-ntfy/**'
      - '.github/workflows/telegram-sandbox-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas unitarias aisladas
        working-directory: experiments/telegram-ntfy
        run: npm test
